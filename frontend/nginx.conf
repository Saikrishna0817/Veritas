server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Backend accepts CSV uploads up to 200 MB (nginx's default is 1 MB), and a
    # full analysis can take minutes on large files (default timeout is 60 s).
    client_max_body_size 210m;

    # ── Security headers (H1) ─────────────────────────────────────────────────
    # CSP is intentionally slightly more permissive than the backend middleware
    # to allow Recharts' inline styles and Google Fonts. Cloudflare Turnstile needs its script and iframe host;
    # direct uploads PUT the file to the R2/S3 bucket, so those storage hosts are allowed in connect-src.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss: https://*.r2.cloudflarestorage.com https://*.amazonaws.com; frame-ancestors 'none'; object-src 'none';"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Backend accepts CSV uploads up to 200 MB (nginx's default is 1 MB), and a
    # full analysis can take minutes on large files (default timeout is 60 s).
    client_max_body_size 210m;

    # ── Security headers (H1) ─────────────────────────────────────────────────
    # CSP is slightly more permissive than the backend middleware: inline styles
    # (React style props, the 3D layer), data: for the keycap model's embedded
    # buffers (connect-src, both the app and the landing page at /welcome/) and images. Fonts are self-hosted (npm @fontsource).
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' data: ws: wss:; frame-ancestors 'none'; object-src 'none';"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Compress text assets: the lazy 3D chunk is ~1 MB raw, ~280 kB gzipped.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Vite's hashed build files never change: cache them for a year. add_header in a
    # location replaces the server-level ones, so the security headers are repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' data: ws: wss:; frame-ancestors 'none'; object-src 'none';"
            always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Public landing page (frontend/landing), a separate static build.
    location /welcome/ { try_files $uri $uri/ /welcome/index.html; }

    location / { try_files $uri $uri/ /index.html; }
}

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: veritas, POSTGRES_DB: veritas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements.txt "moto[s3]" torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Tests
        env:
          VERITAS_TEST_REDIS_URL: redis://localhost:6379/1
          VERITAS_TEST_PG_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:veritas@localhost:5432/veritas' || '' }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser e2e (Playwright)
    runs-on: ubuntu-latest
    env:
      VERITAS_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      VERITAS_ADMIN_USERNAME: e2e-admin
      VERITAS_ADMIN_PASSWORD: e2e-admin-password-1
      E2E_USER: e2e-user
      E2E_PASS: e2e-user-password-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Start API and frontend
        run: |
          (cd backend && python -c "from app.models import database as db; from app.core.security import hash_password; db.init_db(); db.create_user('e2e-user', hash_password('e2e-user-password-1'))")
          (cd backend && python -m uvicorn app.main:app --port 8001 > ../api.log 2>&1 &)
          (cd frontend && npm run dev > ../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8001/health >/dev/null && curl -sf localhost:5173 >/dev/null && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - run: npx playwright test
        working-directory: e2e
      - if: failure()
        run: cat api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: e2e/test-results, retention-days: 7 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  images:
    name: Build and push images
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with: { context: ./backend, push: true, tags: "ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}" }
      - uses: docker/build-push-action@v7
        with: { context: ./frontend, push: true, tags: "ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}" }

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in the repo settings for a manual gate
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REF: ${{ github.ref_name }}
        run: |
          [[ "$REF" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "refusing to deploy ref: $REF"; exit 1; }   # the remote shell reads it
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /opt/veritas && git fetch --tags && git checkout \"$REF\" && docker compose pull --ignore-buildable; docker compose up -d --build && scripts/backup.sh >/dev/null"

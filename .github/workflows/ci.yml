name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: veritas, POSTGRES_DB: veritas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements.txt "moto[s3]" torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Tests
        env:
          VERITAS_TEST_REDIS_URL: redis://localhost:6379/1
          VERITAS_TEST_PG_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:veritas@localhost:5432/veritas' || '' }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  images:
    name: Build and push images
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with: { context: ./backend, push: true, tags: "ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}" }
      - uses: docker/build-push-action@v7
        with: { context: ./frontend, push: true, tags: "ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}" }

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in the repo settings for a manual gate
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /opt/veritas && git fetch --tags && git checkout ${{ github.ref_name }} && docker compose pull --ignore-buildable; docker compose up -d --build && scripts/backup.sh >/dev/null"

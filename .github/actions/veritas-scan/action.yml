name: Veritas scan
description: Scan model files and audit datasets with Veritas in CI. Fails the job when a verdict reaches the threshold.
inputs:
  api-url:      { description: "Veritas API base URL, e.g. https://veritas.example.com/api/v1", required: true }
  api-key:      { description: "API key (store it as a secret)", required: true }
  model-files:  { description: "Space-separated model files to scan", required: false, default: "" }
  data-files:   { description: "Space-separated CSV files to audit", required: false, default: "" }
  reference:    { description: "Trusted reference CSV for data-files", required: false, default: "" }
  fail-on-model: { description: "dangerous or review", required: false, default: "dangerous" }
  fail-on-data:  { description: "LOW_RISK, SUSPICIOUS or CONFIRMED_POISONED", required: false, default: "SUSPICIOUS" }
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - shell: bash
      env:
        VERITAS_API_URL: ${{ inputs.api-url }}
        VERITAS_API_KEY: ${{ inputs.api-key }}
        # inputs reach the script as environment variables, never pasted into it (no shell injection)
        MODEL_FILES: ${{ inputs.model-files }}
        DATA_FILES: ${{ inputs.data-files }}
        REFERENCE: ${{ inputs.reference }}
        FAIL_ON_MODEL: ${{ inputs.fail-on-model }}
        FAIL_ON_DATA: ${{ inputs.fail-on-data }}
        CLI: ${{ github.action_path }}/../../../cli/veritas_cli.py
      run: |
        status=0
        for f in $MODEL_FILES; do
          python "$CLI" scan-model "$f" --fail-on "$FAIL_ON_MODEL" || status=$?
        done
        for f in $DATA_FILES; do
          if [ -n "$REFERENCE" ]; then set -- --reference "$REFERENCE"; else set --; fi
          python "$CLI" check-data "$f" "$@" --fail-on "$FAIL_ON_DATA" || status=$?
        done
        exit $status
